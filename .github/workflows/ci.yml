name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Valores falsos, só para o contexto do Spring subir nos testes
      APP_ADMIN_USERNAME: ci-admin
      APP_ADMIN_PASSWORD_HASH: '$2y$12$ciciciciciciciciciciciOciciciciciciciciciciciciciciciciciciciC'
      TZ: UTC

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Testes (Testcontainers usa o Docker do runner)
        run: |
          chmod +x mvnw
          ./mvnw -B verify