<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nova mensagem do portfólio</title>
</head>
<body style="margin:0;padding:24px;background:#F5F8F6;font-family:Arial,Helvetica,sans-serif;color:#13201A;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;margin:0 auto;">
    <tr>
      <td style="background:#FFFFFF;border:1px solid #DDE5E0;border-radius:12px;padding:24px;">

        <p style="margin:0 0 4px 0;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#0F7B5F;font-weight:bold;">
          Portfólio &middot; contato
        </p>
        <h1 style="margin:0 0 20px 0;font-size:20px;color:#13201A;">Nova mensagem recebida</h1>

        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-bottom:20px;">
          <tr>
            <td style="padding:8px 0;font-size:13px;color:#55635B;width:80px;">Nome</td>
            <td style="padding:8px 0;font-size:15px;" th:text="${name}">Nome do visitante</td>
          </tr>
          <tr>
            <td style="padding:8px 0;font-size:13px;color:#55635B;border-top:1px solid #DDE5E0;">E-mail</td>
            <td style="padding:8px 0;font-size:15px;border-top:1px solid #DDE5E0;" th:text="${email}">visitante@exemplo.com</td>
          </tr>
          <tr>
            <td style="padding:8px 0;font-size:13px;color:#55635B;border-top:1px solid #DDE5E0;">Recebida</td>
            <td style="padding:8px 0;font-size:15px;border-top:1px solid #DDE5E0;" th:text="${receivedAt}">05/11/2026 21:07</td>
          </tr>
        </table>

        <div style="background:#DDF1EA;border-radius:8px;padding:16px;">
          <p style="margin:0 0 8px 0;font-size:13px;color:#0A5442;font-weight:bold;">Mensagem</p>
          <p style="margin:0;font-size:15px;line-height:1.5;white-space:pre-wrap;" th:text="${message}">Texto da mensagem.</p>
        </div>

        <p style="margin:20px 0 0 0;font-size:13px;color:#55635B;">
          Para responder, é só usar o botão <strong>Responder</strong> do seu e-mail: a resposta vai direto para o visitante.
        </p>
      </td>
    </tr>
  </table>
</body>
</html>
