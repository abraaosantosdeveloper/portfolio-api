<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<!--
  Ícones das fases da trajetória (mesmos traços do site).
  fase(tipo, tamanho): tipo = 'WORK' | 'STUDY' | 'MILESTONE'
-->
<body>

<svg th:fragment="fase(tipo, tamanho)" aria-hidden="true" th:width="${tamanho}" th:height="${tamanho}" width="20" height="20"
     viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path th:attr="d=${tipo == 'STUDY'} ? 'M22 10 12 5 2 10l10 5 10-5z M6 12v5c3 2 9 2 12 0v-5'
                 : (${tipo == 'MILESTONE'} ? 'M5 21V4 M5 4h11l-2 4 2 4H5'
                 : 'M5 7h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2 M3 13h18')"
        d="M5 7h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2 M3 13h18"></path>
</svg>

<svg th:fragment="cadeado(tamanho)" aria-hidden="true" th:width="${tamanho}" th:height="${tamanho}" width="18" height="18"
     viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path>
</svg>

<svg th:fragment="mais(tamanho)" aria-hidden="true" th:width="${tamanho}" th:height="${tamanho}" width="26" height="26"
     viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
  <path d="M12 5v14M5 12h14"></path>
</svg>

<svg th:fragment="fechar(tamanho)" aria-hidden="true" th:width="${tamanho}" th:height="${tamanho}" width="16" height="16"
     viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
  <path d="M6 6l12 12M18 6 6 18"></path>
</svg>

</body>
</html>
