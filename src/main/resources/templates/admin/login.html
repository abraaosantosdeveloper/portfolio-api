<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/layout :: head('Entrar')}">
  <meta charset="UTF-8">
  <title>Entrar · abraao.dev / admin</title>
  <link rel="stylesheet" href="../../static/admin/css/admin.css">
</head>
<body class="pagina-login">

  <a class="marca marca--login mono" th:href="${siteUrl} ?: 'https://abraaosantosdeveloper.github.io'" href="#">abraao<span class="marca__ponto">.dev</span> <span class="marca__secao">/ admin</span></a>

  <main class="login">
    <span class="login__icone" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
    </span>

    <h1 class="login__titulo">Entrar no painel</h1>
    <p class="login__sub">Área restrita. Só o dono da casa.</p>

    <p class="aviso aviso--erro" role="alert" th:if="${param.bloqueado}">Muitas tentativas erradas. Tente de novo em 15 minutos.</p>
    <p class="aviso aviso--erro" role="alert" th:if="${param.erro}">Usuário ou senha inválidos.</p>
    <p class="aviso aviso--ok" role="status" th:if="${param.saiu}">Você saiu do painel.</p>

    <form class="login__form" th:action="@{/admin/login}" action="#" method="post">
      <div class="campo">
        <label for="username">Usuário</label>
        <input id="username" name="username" type="text" class="in" autocomplete="username" required autofocus>
      </div>
      <div class="campo campo--seguinte">
        <label for="password">Senha</label>
        <input id="password" name="password" type="password" class="in" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn--primario btn--bloco btn--52">Entrar</button>
    </form>

    <p class="login__nota">Após 5 tentativas erradas, o acesso fica bloqueado por 15 minutos.</p>
  </main>

  <a class="voltar" th:href="${siteUrl} ?: 'https://abraaosantosdeveloper.github.io'" href="#">← Voltar ao site</a>

</body>
</html>
