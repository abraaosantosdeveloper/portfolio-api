<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Entrar · Admin do portfólio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      --fundo: #F5F8F6;
      --superficie: #FFFFFF;
      --texto: #13201A;
      --texto-2: #55635B;
      --linha: #DDE5E0;
      --destaque: #0F7B5F;
      --destaque-escuro: #0A5442;
      --destaque-suave: #DDF1EA;
      --erro: #D9503F;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--fundo);
      color: var(--texto);
      font-family: 'Manrope', Arial, Helvetica, sans-serif;
    }
    .cartao {
      width: 100%;
      max-width: 380px;
      background: var(--superficie);
      border: 1px solid var(--linha);
      border-radius: 16px;
      padding: 32px 28px;
    }
    .selo {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--destaque);
      margin: 0 0 6px 0;
    }
    h1 { margin: 0 0 24px 0; font-size: 24px; font-weight: 800; }
    label { display: block; margin: 16px 0 6px 0; font-size: 14px; font-weight: 600; }
    input {
      width: 100%;
      padding: 12px 14px;
      font: inherit;
      color: var(--texto);
      background: var(--fundo);
      border: 1px solid var(--linha);
      border-radius: 10px;
    }
    input:focus { outline: 2px solid var(--destaque); outline-offset: 1px; background: var(--superficie); }
    button {
      width: 100%;
      margin-top: 24px;
      padding: 13px;
      font: inherit;
      font-weight: 800;
      color: #FFFFFF;
      background: var(--destaque);
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 5px 0 var(--destaque-escuro);
      transition: transform .08s, box-shadow .08s;
    }
    button:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--destaque-escuro); }
    .aviso {
      margin: 0 0 8px 0;
      padding: 10px 12px;
      font-size: 14px;
      border-radius: 10px;
    }
    .aviso.erro { background: #FDECEA; color: #A3372A; }
    .aviso.ok { background: var(--destaque-suave); color: var(--destaque-escuro); }
  </style>
</head>
<body>
  <main class="cartao">
    <p class="selo">Portfólio &middot; admin</p>
    <h1>Entrar</h1>

    <p class="aviso erro" th:if="${param.bloqueado}">Muitas tentativas erradas. Tente novamente em 15 minutos.</p>
    <p class="aviso erro" th:if="${param.erro}">Usuário ou senha inválidos.</p>
    <p class="aviso ok" th:if="${param.saiu}">Você saiu do painel.</p>

    <form th:action="@{/admin/login}" method="post">
      <label for="username">Usuário</label>
      <input id="username" name="username" type="text" autocomplete="username" required autofocus>

      <label for="password">Senha</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>

      <button type="submit">Entrar</button>
    </form>
  </main>
</body>
</html>
